name: Readable

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/manifest.tsv'
      - 'scripts/export-readable.cjs'
      - '.github/workflows/readable.yml'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert catalog
        run: node scripts/export-readable.cjs

      - name: Show summary
        if: always()
        run: |
          echo '--- README ---'
          head -40 readable/README.md || true
          echo '--- problems ---'
          head -40 readable/_problems.txt || true

      - name: Commit result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readable
          if git diff --cached --quiet; then
            echo 'нет изменений'
          else
            git commit -m 'readable: обновление читаемого каталога'
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readable
          path: readable
          retention-days: 14
